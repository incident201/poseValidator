name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test on JDK 17
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1' # Совместимая версия для AGP 9.1.1+ в окружении сборки

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "debug.keystore.base64 not found, generating self-signed debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: gradle :app:testOfflineDebugUnitTest :app:testOnlineDebugUnitTest --no-daemon

      - name: Build Debug APKs
        run: gradle :app:assembleOfflineDebug :app:assembleOnlineDebug --no-daemon

      - name: Rename APKs with Timestamp
        run: |
          TIMESTAMP=$(date +'%d%m%Y%H%M%S')

          OFFLINE_ORIGINAL_PATH="app/build/outputs/apk/offline/debug/app-offline-debug.apk"
          ONLINE_ORIGINAL_PATH="app/build/outputs/apk/online/debug/app-online-debug.apk"

          OFFLINE_APK_NAME="poseValidator_${TIMESTAMP}_offline_debug.apk"
          ONLINE_APK_NAME="poseValidator_${TIMESTAMP}_online_debug.apk"

          OFFLINE_APK_PATH="app/build/outputs/apk/offline/debug/${OFFLINE_APK_NAME}"
          ONLINE_APK_PATH="app/build/outputs/apk/online/debug/${ONLINE_APK_NAME}"

          mv "$OFFLINE_ORIGINAL_PATH" "$OFFLINE_APK_PATH"
          mv "$ONLINE_ORIGINAL_PATH" "$ONLINE_APK_PATH"

          echo "OFFLINE_APK_PATH=${OFFLINE_APK_PATH}" >> $GITHUB_ENV
          echo "ONLINE_APK_PATH=${ONLINE_APK_PATH}" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=poseValidator_${TIMESTAMP}_debug_apks" >> $GITHUB_ENV

      - name: Upload Build Artifacts (Debug APKs)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.OFFLINE_APK_PATH }}
            ${{ env.ONLINE_APK_PATH }}
