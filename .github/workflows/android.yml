name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test on JDK 17
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1' # Совместимая версия для AGP 9.1.1+ в окружении сборки

      - name: Create Mock secrets.properties if required
        run: |
          # Предотвращает возможные падения плагина Secrets Gradle Plugin по умолчанию
          touch local.properties
          echo "GEMINI_API_KEY=mock_key_for_testing" >> local.properties

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "debug.keystore.base64 not found, generating self-signed debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK with Timestamp
        id: rename_apk
        run: |
          # Генерируем таймстамп в формате ddMMyyyyHHmmss (например, 27052026123045)
          TIMESTAMP=$(date +'%d%m%Y%H%M%S')
          
          ORIGINAL_PATH="app/build/outputs/apk/debug/app-debug.apk"
          NEW_NAME="poseValidator_${TIMESTAMP}.apk"
          NEW_PATH="app/build/outputs/apk/debug/${NEW_NAME}"
          
          # Переименовываем физический файл на диске
          mv "$ORIGINAL_PATH" "$NEW_PATH"
          
          # Передаем путь и имя файла в переменные окружения шага для использования далее
          echo "APK_PATH=${NEW_PATH}" >> $GITHUB_ENV
          echo "APK_NAME=${NEW_NAME}" >> $GITHUB_ENV

      - name: Upload Build Artifacts (Debug APK)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
