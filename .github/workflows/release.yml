name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, например 1.0.0"
        required: true
        type: string
      version_code:
        description: "Version code, целое число, например 1, 2, 3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create empty .env
        run: |
          echo "# Release build does not require cloud API keys" > .env

      - name: Decode release keystore
        run: |
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > my-upload-key.jks
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon \
            -PVERSION_NAME="${{ inputs.version_name }}" \
            -PVERSION_CODE="${{ inputs.version_code }}"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          TAG="v${{ inputs.version_name }}"
          ORIGINAL_PATH="app/build/outputs/apk/release/app-release.apk"
          NEW_NAME="poseValidator_${TAG}_release.apk"
          NEW_PATH="app/build/outputs/apk/release/${NEW_NAME}"

          mv "$ORIGINAL_PATH" "$NEW_PATH"

          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "APK_PATH=${NEW_PATH}" >> $GITHUB_ENV
          echo "APK_NAME=${NEW_NAME}" >> $GITHUB_ENV

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}

      - name: Create GitHub Release
        run: |
          gh release create "${TAG}" "${APK_PATH}" \
            --title "${TAG}" \
            --notes "Stable manual release snapshot ${TAG}" \
            --target "${GITHUB_SHA}"
        env:
          GH_TOKEN: ${{ github.token }}
