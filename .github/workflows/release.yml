name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, например 1.0.0"
        required: true
        type: string
      version_code:
        description: "Version code, целое число, например 1, 2, 3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "${ANDROID_HOME}/platforms/android-37.0" ] && [ ! -e "${ANDROID_HOME}/platforms/android-37" ]; then
            ln -s "${ANDROID_HOME}/platforms/android-37.0" "${ANDROID_HOME}/platforms/android-37"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Create empty .env
        run: |
          echo "# Release build does not require cloud API keys" > .env

      - name: Decode release keystore
        run: |
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > my-upload-key.jks
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Run Offline Unit Tests
        run: gradle :app:testOfflineDebugUnitTest --no-daemon --stacktrace

      - name: Run Online Unit Tests
        run: gradle :app:testOnlineDebugUnitTest --no-daemon --stacktrace

      - name: Build Offline Release APK
        run: |
          gradle :app:assembleOfflineRelease --no-daemon --stacktrace \
            -PVERSION_NAME="${{ inputs.version_name }}" \
            -PVERSION_CODE="${{ inputs.version_code }}"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Online Release APK
        run: |
          gradle :app:assembleOnlineRelease --no-daemon --stacktrace \
            -PVERSION_NAME="${{ inputs.version_name }}" \
            -PVERSION_CODE="${{ inputs.version_code }}"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs
        run: |
          TAG="v${{ inputs.version_name }}"

          OFFLINE_ORIGINAL_PATH="app/build/outputs/apk/offline/release/app-offline-release.apk"
          ONLINE_ORIGINAL_PATH="app/build/outputs/apk/online/release/app-online-release.apk"

          OFFLINE_APK_NAME="poseGuard_${TAG}_offline_release.apk"
          ONLINE_APK_NAME="poseGuard_${TAG}_online_release.apk"

          OFFLINE_APK_PATH="app/build/outputs/apk/offline/release/${OFFLINE_APK_NAME}"
          ONLINE_APK_PATH="app/build/outputs/apk/online/release/${ONLINE_APK_NAME}"

          mv "$OFFLINE_ORIGINAL_PATH" "$OFFLINE_APK_PATH"
          mv "$ONLINE_ORIGINAL_PATH" "$ONLINE_APK_PATH"

          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "OFFLINE_APK_PATH=${OFFLINE_APK_PATH}" >> $GITHUB_ENV
          echo "ONLINE_APK_PATH=${ONLINE_APK_PATH}" >> $GITHUB_ENV
          echo "OFFLINE_APK_NAME=${OFFLINE_APK_NAME}" >> $GITHUB_ENV
          echo "ONLINE_APK_NAME=${ONLINE_APK_NAME}" >> $GITHUB_ENV

      - name: Upload release APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: poseGuard_${{ env.TAG }}_release_apks
          path: |
            ${{ env.OFFLINE_APK_PATH }}
            ${{ env.ONLINE_APK_PATH }}

      - name: Create GitHub Release
        run: |
          gh release create "${TAG}" "${OFFLINE_APK_PATH}" "${ONLINE_APK_PATH}" \
            --title "${TAG}" \
            --notes "Stable manual release snapshot ${TAG}" \
            --target "${GITHUB_SHA}" \
            --draft
        env:
          GH_TOKEN: ${{ github.token }}
